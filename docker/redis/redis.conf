# Venice Mesh Redis Configuration 
 port 6379 
 requirepass ${REDIS_PASSWORD} 
 
 # Persistence 
 appendonly yes 
 appendfilename "appendonly.aof" 
 appendfsync everysec 
 
 # Memory management 
 maxmemory 256mb 
 maxmemory-policy allkeys-lru 
 
 # Security 
 protected-mode yes 
 
 # Performance 
 tcp-backlog 511 
 timeout 0 
 tcp-keepalive 300 
 
 # Logging 
 loglevel notice 
 logfile "" 
 
 # Save databases 
 save 900 1 
 save 300 10 
 save 60 10000