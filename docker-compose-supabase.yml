version: '3.8'

# Venice Mesh Backend with Supabase Database
# This docker-compose file runs the API services without PostgreSQL
# (PostgreSQL is hosted on Supabase)

services:
  redis:
    image: redis:7-alpine
    container_name: venice-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - venice-mesh

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: venice-api
    ports:
      - "3000:3000"
    environment:
      # Supabase Database Connection
      POSTGRES_HOST: ${POSTGRES_HOST:-db.qtgbavxodeexazadglwp.supabase.co}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      
      # API Configuration
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      API_URL: ${API_URL:-http://localhost:3000}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      
      # Blockchain
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-rpc.com}
      PRIVATE_KEY: ${PRIVATE_KEY}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      POLYGONSCAN_API_KEY: ${POLYGONSCAN_API_KEY}
      
      # RADIUS
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      RADIUS_PORT: ${RADIUS_PORT:-1812}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    
    depends_on:
      redis:
        condition: service_healthy
    
    volumes:
      - ./api:/app/api
      - ./db:/app/db
    
    networks:
      - venice-mesh
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: venice-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - venice-mesh
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  venice-mesh:
    driver: bridge
